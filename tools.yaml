schema: 1
recorded_at: '2026-08-19'
container:
  name: kali
  base_image: kalilinux/kali-rolling:latest
  distribution: Kali GNU/Linux
  version: '2026.3'

# Tool versions reflect the live `kali` container after installation.
tools: #메타스플릿
  - name: metasploit-framework
    package: metasploit-framework
    status: installed
    source: apt
    package_version: '6.5.0-0kali1'
    command: msfconsole
    command_version: '6.5.0-dev'
    category: exploitation-framework
    reproducible_image: false
    notes: Installed in the legacy live kali container, but excluded from docker/Dockerfile as of 2026-08-22. Rebuild the image and recreate the container to remove it from runtime.

    #map
  - name: nmap
    package: nmap
    status: installed
    source: base-image
    package_version: '7.99+dfsg-1kali1'
    command: nmap
    category: network-scanner
    notes: Present in the current container before the Metasploit install.

    #john 패스워드 크래킹
  - name: john
    package: john
    status: installed
    source: base-image
    package_version: '1.9.0-Jumbo-1+git20211102-0kali11'
    command: john
    category: password-auditing
    notes: Present in the current container before the Metasploit install.

    #단어 목록
  - name: wordlists
    package: wordlists
    status: installed
    source: apt
    package_version: '2026.2.0'
    category: password-auditing-and-discovery-data
    paths:
      - /usr/share/wordlists/john.lst
      - /usr/share/wordlists/metasploit
      - /usr/share/wordlists/nmap.lst
      - /usr/share/wordlists/rockyou.txt.gz
    notes: RockYou is installed in compressed form.

    #gobuster용 
  - name: seclists
    package: seclists
    status: installed
    source: apt
    package_version: '2025.3-0kali1'
    paths:
      - /usr/share/seclists
      - /usr/share/seclists/Discovery/Web-Content/common.txt
    category: discovery-wordlists
    notes: Includes web-content and DNS discovery lists for Gobuster and related tools.

    #subdomain finder, dns사용해서 
  - name: subfinder
    package: subfinder
    status: installed
    source: apt
    package_version: '2.14.0-0kali1'
    command: subfinder
    command_version: 'v2.14.0'
    category: subdomain-discovery

    #서브도메인 수집(패시브, CT 로그/아카이브) - subfinder와 sort -u 병합
  - name: assetfinder
    package: github.com/tomnomnom/assetfinder
    status: planned
    source: go-install
    source_tag: 'v0.1.0'
    command: assetfinder
    category: subdomain-discovery
    notes: Added to recon-web.Dockerfile go-builder stage; requires worker image rebuild (local/hermes-recon-web:0.1). Merged with subfinder output into parsed/hosts.txt via sorted unique merge.

    #서브도메인 수집(OWASP Amass, 패시브 전용) - collect 단계 자동 실행
  - name: amass
    package: amass
    status: planned
    source: apt
    command: amass
    category: subdomain-discovery
    notes: Harness runs only `amass enum -passive -d <domain>` (no target DNS contact). Active enumeration is intentionally not enabled; it would require the approval-gated discovery stage.
  - name: httpx
    package: httpx-toolkit
    status: installed
    source: apt
    package_version: '1.9.0-0kali2'
    command: httpx
    command_alias: httpx-toolkit
    category: web-probing
    notes: Kali installs the ProjectDiscovery binary as httpx-toolkit; /usr/local/bin/httpx is a compatibility symlink. Headless screenshot mode was verified with its Rod-managed Chromium browser; the first run downloads an approximately 533 MB browser cache under /root/.cache/rod.
    screenshot_runtime:
      verified: true
      browser_cache: /root/.cache/rod/browser/chromium-1321438
      browser_cache_size: 533MB
      direct_runtime_packages:
        - libglib2.0-0t64
        - libnss3
        - libnspr4
        - libatk1.0-0t64
        - libatk-bridge2.0-0t64
        - libatspi2.0-0t64
        - libcups2t64
        - libdrm2
        - libgbm1
        - libasound2t64
        - libxcomposite1
        - libxdamage1
        - libxfixes3
        - libxrandr2
        - libxkbcommon0
        - libpango-1.0-0
        - libcairo2

    #도메인 찾기(dos)
  - name: gobuster
    package: gobuster
    status: installed
    source: apt
    package_version: '3.8.2-1'
    command: gobuster
    command_version: '3.8.2'
    category: content-and-dns-discovery

    #param찾기
  - name: parameth
    package: parameth
    status: installed
    source: github
    source_url: https://github.com/maK-/parameth
    source_commit: '8da6f27c071f00bc0bd26a565de474e7ab5baa42'
    command: parameth
    command_version: 'v1.337'
    runtime: python2
    category: parameter-discovery
    dependencies:
      - numpy==1.16.6
      - requests==2.27.1
      - fuzzywuzzy==0.18.0
      - python-Levenshtein==0.12.2
    notes: Upstream is Python 2 code; the installed copy uses an explicit python2 shebang and an absolute default wordlist path at /opt/parameth/lists/all.txt.

    #옛날 url
  - name: waybackurls
    package: github.com/tomnomnom/waybackurls
    status: installed
    source: go-install
    source_tag: 'v0.1.0'
    command: waybackurls
    category: historical-url-discovery

    #크롤러
  - name: katana
    package: github.com/projectdiscovery/katana/cmd/katana
    status: installed
    source: go-install
    source_tag: 'v1.7.0'
    command: katana
    category: web-crawling

    #취약점 스케너
  - name: nuclei
    package: nuclei
    status: installed
    source: apt
    package_version: '3.11.0-0kali1'
    command: nuclei
    command_version: 'v3.11.0'
    template_version: 'v10.4.7'
    template_path: /root/.local/nuclei-templates
    template_count_probe: 13510
    category: vulnerability-scanning
    reproducible_image: false
    notes: Installed with templates in the legacy live kali container, but excluded from docker/Dockerfile as of 2026-08-22. Reserve it for a future validation image.

    #google 검색
  - name: goohak
    package: Goohak
    status: installed
    source: github
    source_url: https://github.com/1N3/Goohak
    source_commit: '815a31e487c5f76d1e9b28c0f982d4807459db7f'
    command: goohak
    command_version: '1.9'
    category: google-hacking-query-launcher
    notes: Browser-launching helper; defaults to xdg-open in the container and accepts GOOHAK_BROWSER to override it.

planned: []
